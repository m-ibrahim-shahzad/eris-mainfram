<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Eris AI Mainframe Terminal</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #0b0c10;
            color: #e2e8f0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
        }
        
        /* Sidebar Layout Container */
        .sidebar {
            width: 280px;
            min-width: 280px;
            background-color: #111217;
            border-right: 1px solid #1f2026;
            display: flex;
            flex-direction: column;
            padding: 24px 16px 16px 16px;
            height: 100%;
            transition: transform 0.25s ease;
            position: relative;
        }
        
        .new-chat-btn {
            background: #ffffff;
            color: #111217;
            padding: 14px;
            border-radius: 12px;
            text-align: center;
            cursor: pointer;
            margin-bottom: 24px;
            font-weight: 600;
            font-size: 0.95rem;
            transition: all 0.2s ease;
            user-select: none;
        }
        .new-chat-btn:hover {
            background: #f1f5f9;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(255, 255, 255, 0.1);
        }
        
        /* Interactive Recents Segment Bar Header */
        .recents-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            padding: 0 8px;
            cursor: pointer;
            user-select: none;
        }
        .history-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #64748b;
            font-weight: 700;
        }
        .collapse-arrow {
            width: 14px;
            height: 14px;
            fill: none;
            stroke: #64748b;
            stroke-width: 2.5;
            stroke-linecap: round;
            stroke-linejoin: round;
            opacity: 0;
            transition: transform 0.2s ease, opacity 0.2s ease;
        }
        .recents-header:hover .collapse-arrow {
            opacity: 1;
        }
        .collapse-arrow.collapsed {
            transform: rotate(-90deg);
        }

        .history-list {
            flex: 1;
            overflow-y: auto;
            padding-right: 4px;
            margin-bottom: 12px;
        }
        .history-list.hidden-pane {
            display: none;
        }

        /* Hover Action Items Container */
        .history-item-container {
            position: relative;
            margin-bottom: 6px;
        }
        .history-item {
            padding: 12px 40px 12px 12px;
            background: transparent;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            color: #94a3b8;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            transition: all 0.2s;
            border: 1px solid transparent;
            width: 100%;
            text-align: left;
        }
        .history-item-container:hover .history-item {
            background: #1f2026;
            color: #f1f5f9;
        }
        
        /* Three Dots Option Trigger Button */
        .item-options-trigger {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: transparent;
            border: none;
            color: #64748b;
            cursor: pointer;
            font-size: 1.1rem;
            font-weight: bold;
            line-height: 1;
            padding: 4px 6px;
            display: none;
            border-radius: 4px;
        }
        .history-item-container:hover .item-options-trigger {
            display: block;
        }
        .item-options-trigger:hover {
            color: #f1f5f9;
            background: rgba(255, 255, 255, 0.05);
        }

        /* Custom Options Context Dropdown Box */
        .options-dropdown {
            position: absolute;
            right: 12px;
            top: 38px;
            background: #181920;
            border: 1px solid #2d3139;
            border-radius: 8px;
            width: 120px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            z-index: 100;
            display: none;
        }
        .options-dropdown.active {
            display: block;
        }
        .dropdown-opt {
            padding: 10px 12px;
            font-size: 0.85rem;
            color: #94a3b8;
            cursor: pointer;
            transition: all 0.15s;
        }
        .dropdown-opt:hover {
            background: #22242d;
            color: #f1f5f9;
        }
        .dropdown-opt.opt-delete {
            color: #ef4444;
        }
        .dropdown-opt.opt-delete:hover {
            background: rgba(239, 68, 68, 0.1);
        }

        /* NEW: Sidebar bottom profile trigger deck design mappings */
        .account-profile-trigger {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            background: transparent;
            border-radius: 12px;
            cursor: pointer;
            user-select: none;
            transition: background 0.2s ease;
            margin-top: auto;
            border: 1px solid transparent;
            text-decoration: none;
            color: inherit;
        }
        .account-profile-trigger:hover {
            background: #1f2026;
        }
        .profile-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: #2d3139;
            object-fit: cover;
            border: 1px solid #2d3139;
        }
        .profile-info {
            flex: 1;
            overflow: hidden;
        }
        .profile-name {
            font-size: 0.92rem;
            font-weight: 500;
            color: #f1f5f9;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* NEW: Account Context Dropdown Panel structure rules */
        .account-popup-menu {
            position: absolute;
            bottom: 74px;
            left: 16px;
            right: 16px;
            background: #181920;
            border: 1px solid #2d3139;
            border-radius: 12px;
            padding: 6px;
            box-shadow: 0 -10px 25px rgba(0,0,0,0.5);
            z-index: 110;
            display: none;
            transform-origin: bottom center;
            animation: menuPopUp 0.18s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .account-popup-menu.active {
            display: block;
        }
        @keyframes menuPopUp {
            from { transform: translateY(8px) scale(0.97); opacity: 0; }
            to { transform: translateY(0) scale(1); opacity: 1; }
        }
        .account-menu-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px;
            font-size: 0.9rem;
            color: #94a3b8;
            cursor: pointer;
            border-radius: 8px;
            text-decoration: none;
            transition: all 0.15s;
        }
        .account-menu-item:hover {
            background: #22242d;
            color: #f1f5f9;
        }
        .account-menu-item.item-logout {
            border-top: 1px solid #2d3139;
            border-radius: 0 0 8px 8px;
            margin-top: 4px;
            padding-top: 14px;
        }

        /* Main Center Processing Canvas Workspace Frame */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: #0b0c10;
            position: relative;
            height: 100%;
            overflow: hidden;
        }
        .top-bar {
            height: 70px;
            min-height: 70px;
            border-bottom: 1px solid #1f2026;
            display: flex;
            align-items: center;
            padding: 0 40px;
            background-color: #111217;
            z-index: 10;
            gap: 12px;
        }
        .top-bar h2 {
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            color: #f8fafc;
            display: flex;
            align-items: center;
            gap: 10px;
            user-select: none;
        }
        .top-bar h2::before {
            content: '';
            display: inline-block;
            width: 8px;
            height: 8px;
            background: #3b82f6;
            border-radius: 50%;
            box-shadow: 0 0 10px #3b82f6;
        }

        /* Centralized Main Greeting Hero Display Panel */
        .welcome-hero {
            position: absolute;
            top: 42%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            width: 100%;
            padding: 0 20px;
            pointer-events: none;
            z-index: 1;
        }
        .welcome-hero h1 {
            font-size: 2.2rem;
            font-weight: 600;
            color: #ffffff;
            letter-spacing: -0.5px;
        }

        /* Messaging Render Area viewport bounds */
        .chat-area {
            flex: 1;
            overflow-y: auto;
            padding: 40px 18%;
            display: flex;
            flex-direction: column;
            gap: 24px;
            position: relative;
            z-index: 2;
        }
        .message-wrapper {
            display: flex;
            flex-direction: column;
            width: 100%;
        }
        .message {
            max-width: 85%;
            padding: 14px 20px;
            border-radius: 16px;
            line-height: 1.6;
            font-size: 0.98rem;
            word-wrap: break-word;
        }
        .user-wrapper { align-items: flex-end; }
        .user-message { background-color: #272930; color: #ffffff; border-bottom-right-radius: 4px; }
        .ai-wrapper { align-items: flex-start; }
        .ai-message { background-color: #111217; color: #e2e8f0; border-bottom-left-radius: 4px; border: 1px solid #1f2026; }
        
        /* Code Block & Markdown Rendering Properties Layout fixes */
        .ai-message pre { background: #0b0c10; padding: 14px; border-radius: 8px; overflow-x: auto; margin: 12px 0; border: 1px solid #1f2026; }
        .ai-message code { font-family: 'Courier New', Courier, monospace; font-size: 0.9rem; background: rgba(255,255,255,0.06); padding: 2px 6px; border-radius: 4px; }
        .ai-message pre code { background: transparent; padding: 0; }
        .ai-message p { margin-bottom: 8px; }
        .ai-message p:last-child { margin-bottom: 0; }
        .ai-message ul, .ai-message ol { margin-left: 20px; margin-bottom: 8px; }

        .meta-stamp {
            font-size: 0.7rem;
            font-weight: 600;
            color: #3b82f6;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-top: 6px;
            padding: 2px 8px;
            background: rgba(59, 130, 246, 0.1);
            border-radius: 4px;
            display: inline-block;
            width: fit-content;
        }

        /* Cyberpunk Neon Pulse Loading Bar indicator rules */
        .quantum-loader-bar {
            width: 140px;
            height: 4px;
            background: #1f2026;
            border-radius: 4px;
            overflow: hidden;
            position: relative;
            margin: 6px 0;
        }
        .quantum-loader-progress {
            width: 40%;
            height: 100%;
            background: linear-gradient(90deg, #3b82f6, #60a5fa);
            box-shadow: 0 0 8px #3b82f6;
            border-radius: 4px;
            position: absolute;
            left: -40%;
            animation: quantumShift 1.2s infinite linear;
        }
        @keyframes quantumShift {
            0% { left: -40%; }
            100% { left: 100%; }
        }

        /* Input Deck Frame Layout Container Constraints */
        .input-container {
            padding: 24px 18% 36px 18%;
            background: linear-gradient(180deg, transparent 0%, #0b0c10 50%);
            z-index: 10;
        }
        .input-box-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            background: #111217;
            border: 1px solid #1f2026;
            border-radius: 28px;
            padding: 6px 10px 6px 24px;
            transition: all 0.2s ease;
        }
        .input-box-wrapper:focus-within {
            border-color: #3b82f6;
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.25);
            background: #14161d;
        }
        input[type="text"] {
            flex: 1;
            background: transparent;
            border: none;
            color: #f1f5f9;
            font-size: 0.98rem;
            outline: none;
            padding: 12px 0;
            -webkit-appearance: none;
        }
        input[type="text"]::placeholder { color: #4b5563; }
        .execute-btn {
            background: #3b82f6;
            color: #ffffff;
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .execute-btn:hover { background: #2563eb; transform: scale(1.05); }
        .execute-btn svg {
            width: 18px; height: 18px; fill: none; stroke: #ffffff;
            stroke-width: 3; stroke-linecap: round; stroke-linejoin: round;
        }
        
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #1f2026; border-radius: 10px; }

        .sidebar-toggle-btn {
            display: none;
        }

        @media (max-width: 768px) {
            body {
                display: block;
                height: 100vh;
                height: -webkit-fill-available;
            }

            .sidebar {
                position: fixed;
                top: 0;
                left: 0;
                z-index: 50;
                height: 100vh;
                height: -webkit-fill-available;
                width: 82vw;
                min-width: 82vw;
                max-width: 320px;
                transform: translateX(-100%);
                box-shadow: 12px 0 30px rgba(0,0,0,0.45);
                padding-top: 18px;
                transition: transform 0.25s ease;
            }

            body.sidebar-open .sidebar {
                transform: translateX(0);
            }

            .main-content {
                width: 100vw;
                height: 100vh;
                height: -webkit-fill-available;
            }

            .top-bar {
                padding: 0 14px;
                position: relative;
            }

            .sidebar-toggle-btn {
                display: inline-flex;
                align-items: center;
                justify-content: center;
                width: 42px;
                height: 42px;
                background: #111217;
                border: 1px solid #2d3139;
                color: #94a3b8;
                border-radius: 12px;
                cursor: pointer;
                flex: 0 0 auto;
                font-size: 1rem;
            }

            .sidebar-toggle-btn:hover {
                background: #171923;
                color: #f1f5f9;
            }

            .top-bar h2 {
                font-size: 0.92rem;
            }

            .chat-area {
                padding: 16px 14px;
            }

            .message {
                max-width: 94%;
            }

            .input-container {
                padding: 10px 12px calc(16px + env(safe-area-inset-bottom));
                background: #0b0c10;
            }

            .input-box-wrapper {
                padding: 4px 6px 4px 16px;
            }

            input[type="text"] {
                padding: 10px 0;
                font-size: 1rem;
            }

            .welcome-hero h1 {
                font-size: 1.5rem;
            }

            .new-chat-btn {
                font-size: 0.9rem;
            }

            .history-item {
                font-size: 0.88rem;
            }
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="new-chat-btn" onclick="startNewChat()">New Chat</div>
        
        <div class="recents-header" onclick="toggleRecentsPanel(event)">
            <span class="history-label">Recents</span>
            <svg class="collapse-arrow" id="recents-arrow" viewBox="0 0 24 24">
                <polyline points="6 9 12 15 18 9"></polyline>
            </svg>
        </div>
        
        <div id="history-list" class="history-list"></div>

        <div class="account-popup-menu" id="account-popup-menu">
            <a href="/login" class="account-menu-item">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="8.5" cy="7" r="4"></circle><line x1="20" y1="8" x2="20" y2="14"></line><line x1="23" y1="11" x2="17" y2="11"></line></svg>
                Add Account
            </a>
            <a href="/logout" class="account-menu-item item-logout" style="color: #ef4444;">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
                Log Out
            </a>
        </div>

        {% if 'user_profile' in session %}
        <div class="account-profile-trigger" onclick="toggleAccountMenu(event)">
            <img class="profile-avatar" src="{{ session['user_profile'].get('picture', '') }}" alt="avatar" onerror="this.src='https://www.gravatar.com/avatar/00000000000000000000000000000000?d=mp&f=y';">
            <div class="profile-info">
                <div class="profile-name">{{ session['user_profile'].get('name', 'Mainframe Pilot') }}</div>
            </div>
            <span style="color: #64748b; font-size: 0.8rem;">&#9652;</span>
        </div>
        {% else %}
        <a href="/login" class="account-profile-trigger">
            <div class="profile-avatar" style="display: flex; align-items: center; justify-content: center; color: #64748b; font-size: 1.1rem;">&#128100;</div>
            <div class="profile-info">
                <div class="profile-name">Guest Terminal</div>
            </div>
            <span style="color: #3b82f6; font-size: 0.85rem; font-weight: 600;">Login</span>
        </a>
        {% endif %}
    </div>


    <div class="main-content">
        <div class="top-bar">
            <button class="sidebar-toggle-btn" onclick="toggleSidebar()">☰</button>
            <h2>ERIS MAINFRAME</h2>
        </div>
        
        <div id="welcome-hero" class="welcome-hero">
            <h1>What's on your mind?</h1>
        </div>
        
        <div id="chat-area" class="chat-area"></div>
        
        <div class="input-container">
            <div class="input-box-wrapper">
                <input type="text" id="user-input" placeholder="Ask Eris anything..." onkeypress="handleKeyPress(event)">
                <button class="execute-btn" onclick="sendPrompt()">
                    <svg viewBox="0 0 24 24">
                        <line x1="12" y1="19" x2="12" y2="5"></line>
                        <polyline points="5 12 12 5 19 12"></polyline>
                    </svg>
                </button>
            </div>
        </div>
    </div>


    <script>
        let currentSessionId = "";
        let isTypingActive = false;

        function toggleSidebar() {
            document.body.classList.toggle('sidebar-open');
        }

        function checkHeroVisibility() {
            const hero = document.getElementById('welcome-hero');
            const chatArea = document.getElementById('chat-area');
            if (chatArea.children.length > 0) {
                hero.style.display = 'none';
            } else {
                hero.style.display = 'block';
            }
        }

        function toggleRecentsPanel(e) {
            const arrow = document.getElementById('recents-arrow');
            const list = document.getElementById('history-list');
            arrow.classList.toggle('collapsed');
            list.classList.toggle('hidden-pane');
        }

        /* NEW: Controls Account Sub menu slide deck toggling states */
        function toggleAccountMenu(e) {
            e.stopPropagation();
            const menu = document.getElementById('account-popup-menu');
            menu.classList.toggle('active');
        }

        async function loadSidebarHistory() {
            try {
                const response = await fetch('/api/history');
                if (response.ok) {
                    const histories = await response.json();
                    const listContainer = document.getElementById('history-list');
                    listContainer.innerHTML = '';
                    
                    histories.forEach(item => {
                        const container = document.createElement('div');
                        container.className = 'history-item-container';

                        const itemDiv = document.createElement('div');
                        itemDiv.className = 'history-item';
                        itemDiv.innerText = item.title;
                        itemDiv.onclick = () => selectSession(item.id);
                        container.appendChild(itemDiv);

                        const dotsBtn = document.createElement('button');
                        dotsBtn.className = 'item-options-trigger';
                        dotsBtn.innerHTML = '&#8943;';
                        dotsBtn.onclick = (e) => {
                            e.stopPropagation();
                            toggleDropdownMenu(item.id);
                        };
                        container.appendChild(dotsBtn);

                        const dropdown = document.createElement('div');
                        dropdown.className = 'options-dropdown';
                        dropdown.id = `dropdown-${item.id}`;
                        dropdown.innerHTML = `
                            <div class="dropdown-opt" onclick="renameChatThread('${item.id}', '${item.title.replace(/'/g, "\\'")}', event)">Rename</div>
                            <div class="dropdown-opt opt-delete" onclick="deleteIndividualChat('${item.id}', event)">Delete</div>
                        `;
                        container.appendChild(dropdown);

                        listContainer.appendChild(container);
                    });
                }
            } catch (err) {
                console.error("Failed to load historical vectors index", err);
            }
        }

        function toggleDropdownMenu(sessionId) {
            document.querySelectorAll('.options-dropdown').forEach(el => {
                if(el.id !== `dropdown-${sessionId}`) el.classList.remove('active');
            });
            const menu = document.getElementById(`dropdown-${sessionId}`);
            if (menu) menu.classList.toggle('active');
        }

        // Global dismiss interactions hook
        document.addEventListener('click', () => {
            document.querySelectorAll('.options-dropdown').forEach(el => el.classList.remove('active'));
            const accMenu = document.getElementById('account-popup-menu');
            if (accMenu) accMenu.classList.remove('active');
        });

        async function renameChatThread(sessionId, oldTitle, e) {
            e.stopPropagation();
            const newTitle = prompt("Enter a new title for this conversation thread:", oldTitle);
            if (!newTitle || !newTitle.trim()) return;
            
            try {
                const response = await fetch(`/api/session/${sessionId}/rename`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ title: newTitle.trim() })
                });
                if (response.ok) {
                    loadSidebarHistory();
                }
            } catch (err) {
                console.error("Failed adjusting title profile mappings", err);
            }
        }

        async function deleteIndividualChat(sessionId, e) {
            e.stopPropagation();
            if (!confirm("Delete this chat thread completely?")) return;
            
            try {
                const response = await fetch(`/api/session/${sessionId}`, { method: 'DELETE' });
                if (response.ok) {
                    if (currentSessionId === sessionId) {
                        startNewChat();
                    }
                    loadSidebarHistory();
                }
            } catch (err) {
                console.error("Failure pruning selected chat profile matrix", err);
            }
        }

        async function selectSession(sessionId) {
            if (isTypingActive) return;
            currentSessionId = sessionId;
            try {
                const response = await fetch(`/api/session/${sessionId}`);
                if (response.ok) {
                    const data = await response.json();
                    const chatArea = document.getElementById('chat-area');
                    chatArea.innerHTML = '';
                    data.messages.forEach(msg => {
                        renderMessage(msg.content, msg.role === 'user', "", false);
                    });
                    checkHeroVisibility();
                    if (window.innerWidth <= 768) document.body.classList.remove('sidebar-open');
                }
            } catch (err) {
                console.error("Error matching profile database records", err);
            }
        }

        function startNewChat() {
            if (isTypingActive) return;
            currentSessionId = "";
            document.getElementById('chat-area').innerHTML = '';
            checkHeroVisibility();
            if (window.innerWidth <= 768) document.body.classList.remove('sidebar-open');
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') sendPrompt();
        }

        async function sendPrompt() {
            if (isTypingActive) return;
            const inputEl = document.getElementById('user-input');
            const prompt = inputEl.value.trim();
            if (!prompt) return;

            document.getElementById('welcome-hero').style.display = 'none';
            renderMessage(prompt, true, "", false);
            inputEl.value = '';

            const loaderId = showThinkingIndicator();

            try {
                const response = await fetch('/ask', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt: prompt, session_id: currentSessionId })
                });
                
                removeThinkingIndicator(loaderId);

                if (response.ok) {
                    const result = await response.json();
                    currentSessionId = result.session_id;
                    renderMessage(result.response, false, result.model_used, true);
                    loadSidebarHistory();
                } else {
                    renderMessage("Processing pipeline failed. Upstream routing error.", false, "", false);
                }
            } catch (err) {
                removeThinkingIndicator(loaderId);
                renderMessage("Unable to connect to active workspace server gateway.", false, "", false);
            }
        }

        function showThinkingIndicator() {
            const chatArea = document.getElementById('chat-area');
            const id = 'loader-' + Date.now();
            const wrapper = document.createElement('div');
            wrapper.className = 'message-wrapper ai-wrapper';
            wrapper.id = id;
            const msgDiv = document.createElement('div');
            msgDiv.className = 'message ai-message';
            msgDiv.innerHTML = `
                <div class="quantum-loader-bar">
                    <div class="quantum-loader-progress"></div>
                </div>`;
            wrapper.appendChild(msgDiv);
            chatArea.appendChild(wrapper);
            chatArea.scrollTop = chatArea.scrollHeight;
            return id;
        }

        function removeThinkingIndicator(id) {
            const loader = document.getElementById(id);
            if (loader) loader.remove();
        }

        function renderMessage(text, isUser, modelInfo = "", animate = false) {
            const chatArea = document.getElementById('chat-area');
            const wrapper = document.createElement('div');
            wrapper.className = `message-wrapper ${isUser ? 'user-wrapper' : 'ai-wrapper'}`;
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${isUser ? 'user-message' : 'ai-message'}`;
            wrapper.appendChild(msgDiv);

            let metaStamp = null;
            if (!isUser && modelInfo) {
                metaStamp = document.createElement('div');
                metaStamp.className = 'meta-stamp';
                metaStamp.innerText = modelInfo;
                metaStamp.style.opacity = animate ? '0' : '1';
                wrapper.appendChild(metaStamp);
            }

            chatArea.appendChild(wrapper);

            if (isUser) {
                msgDiv.innerText = text;
                chatArea.scrollTop = chatArea.scrollHeight;
            } else if (animate) {
                isTypingActive = true;
                let index = 0;
                let currentText = "";
                const speed = 14;

                function type() {
                    if (index < text.length) {
                        currentText += text.charAt(index);
                        msgDiv.innerHTML = marked.parse(currentText);
                        index++;
                        chatArea.scrollTop = chatArea.scrollHeight;
                        setTimeout(type, speed);
                    } else {
                        isTypingActive = false;
                        if (metaStamp) metaStamp.style.opacity = '1';
                    }
                }
                type();
            } else {
                msgDiv.innerHTML = marked.parse(text);
                chatArea.scrollTop = chatArea.scrollHeight;
            }
        }

        window.onload = () => {
            loadSidebarHistory();
            checkHeroVisibility();
        };
    </script>
</body>
</html>
